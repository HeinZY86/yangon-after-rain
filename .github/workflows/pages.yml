name: Build playable Yangon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yangon-pages
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: city
          key: yangon-city-v1-${{ hashFiles('build_city.py', 'build-city.sh') }}
      - name: Compile playable street cells
        run: sh build-city.sh
      - name: Assemble static site
        run: |
          mkdir -p public
          cp -r city public/
          if [ -f index.html ]; then cp index.html public/; else echo 'Preparing Yangon After Rain.' > public/index.html; fi
          if [ -f peerjs.min.js ]; then cp peerjs.min.js public/; fi
          if [ -f peerjs-LICENSE ]; then cp peerjs-LICENSE public/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
